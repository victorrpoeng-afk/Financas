<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças</title>
<meta name="theme-color" content="#f5f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f5f6f8; --side: #ffffff; --card: #ffffff; --card-2: #f2f4f7; --hover: #f5f6f8;
  --text: #101828; --text-2: #475467; --muted: #8a94a6;
  --border: #e7e9ee; --border-2: #d9dde4; --grid: #eef0f3; --axis: #dfe2e8;
  --accent: #4f46e5; --accent-2: #6366f1; --accent-soft: #eef0ff; --on-accent: #ffffff;
  --up: #027a48; --up-soft: #e8f6ef; --down: #d92d20; --down-soft: #fdecea;
  --s1: #4f6bed; --s2: #f08a4b; --s3: #1fa58a; --s4: #e9b138; --s5: #df6fa0; --s6: #3fa35b; --s7: #8a6cf0; --s8: #e5534b;
  --good: #12b76a; --warning: #f5b324; --serious: #f0874f; --critical: #e5484d;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.03);
  --shadow-lg: 0 12px 32px -12px rgba(16,24,40,.18);
  --radius: 18px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0d12; --side: #0f1218; --card: #141821; --card-2: #1b202b; --hover: #1b202b;
  --text: #eef0f4; --text-2: #b4bccb; --muted: #7c8597;
  --border: #232a36; --border-2: #2e3644; --grid: #1f2530; --axis: #2a313d;
  --accent: #8b8cf8; --accent-2: #a5a6fb; --accent-soft: rgba(139,140,248,.14); --on-accent: #0b0d12;
  --up: #3ccb7f; --up-soft: rgba(60,203,127,.12); --down: #f97066; --down-soft: rgba(249,112,102,.12);
  --s1: #6f87f5; --s2: #f39a62; --s3: #34bfa1; --s4: #f0c14f; --s5: #ea86b2; --s6: #59b974; --s7: #a08af5; --s8: #f07068;
  --shadow: none; --shadow-lg: 0 12px 32px -12px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
       font: 14.5px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-feature-settings: "cv11", "ss01"; }
button { font: inherit; color: inherit; }
a { color: inherit; }
.num, .val, .hero-val, .wval, .li-v, td.num { font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.app > * { min-width: 0; }

/* ---------- barra lateral */
aside { background: var(--side); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh;
        display: flex; flex-direction: column; }
.brand { display: flex; gap: 11px; align-items: center; padding: 22px 20px 14px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--text); display: grid; place-items: center; color: var(--bg); flex: none; }
.brand b { display: block; font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 12.5px; }
nav { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
nav h6 { margin: 20px 10px 6px; font-size: 11px; letter-spacing: .06em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
nav a { display: flex; gap: 11px; align-items: center; padding: 7px 10px; border-radius: 9px; color: var(--text-2);
        text-decoration: none; font-size: 14px; font-weight: 500; transition: background .12s, color .12s; }
nav a:hover { background: var(--hover); color: var(--text); }
nav a.on { background: var(--card-2); color: var(--text); font-weight: 600; }
nav a.on svg { color: var(--accent); }
nav svg { width: 17px; height: 17px; flex: none; }
.foot { border-top: 1px solid var(--border); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
        font-size: 12px; color: var(--muted); }
.icon-btn { background: var(--card); border: 1px solid var(--border); border-radius: 9px; width: 32px; height: 32px; cursor: pointer;
            display: grid; place-items: center; color: var(--text-2); flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--text); }

/* ---------- topo */
main { min-width: 0; }
header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 36px;
         position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 82%, transparent);
         backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid transparent; }
header.rolou { border-bottom-color: var(--border); }
header h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
header p { margin: 1px 0 0; color: var(--muted); font-size: 13.5px; }
.top-acoes { display: flex; align-items: center; gap: 8px; }
.mes { display: flex; align-items: center; gap: 2px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 3px; box-shadow: var(--shadow); }
.mes b { min-width: 136px; text-align: center; font-size: 14px; font-weight: 600; }
.mes button { background: none; border: none; cursor: pointer; width: 30px; height: 30px; border-radius: 9px; color: var(--text-2); display: grid; place-items: center; }
.mes button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.mes button:disabled { opacity: .3; cursor: default; }
.so-mobile { display: none; }

/* ---------- conteúdo */
.content { padding: 8px 36px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; max-width: 1360px; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; min-width: 0; box-shadow: var(--shadow); }
.card h2 { margin: 0; font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; }
.card .sub { color: var(--muted); font-size: 13px; margin: 2px 0 16px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.kpi { padding: 18px 20px; }
.kpi .rot { color: var(--text-2); font-size: 13px; font-weight: 500; }
.kpi .val { font-size: 23px; font-weight: 650; margin: 6px 0 4px; letter-spacing: -.025em; line-height: 1.15; }
.kpi .det { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.up { color: var(--up); } .down { color: var(--down); }
.dim { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 99px;
        background: var(--card-2); color: var(--text-2); white-space: nowrap; vertical-align: 1px; }
.chip i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tbody tr { transition: background .1s; }
tbody tr:hover td { background: var(--hover); }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.dim { color: var(--text-2); }
tfoot td { font-weight: 650; border-top: 1px solid var(--border-2); border-bottom: none; }
.tbl { overflow-x: auto; margin: 0 -10px; }
.chart { position: relative; height: 290px; }
.chart.alto { height: 340px; }
.chart.mini { height: 150px; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 180px) 1fr auto; gap: 14px; align-items: center; padding: 6px 0; font-size: 13.5px; }
.bar-row > span:first-child { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 8px; background: var(--card-2); border-radius: 99px; overflow: hidden; }
.track > div { height: 100%; border-radius: 99px; background: var(--s1); }
.seg { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 3px; margin: 6px 0 18px; }
.seg div { height: 100%; border-radius: 3px; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 18px; font-size: 13.5px; }
.legend > span { display: flex; align-items: center; gap: 8px; }
.legend > span b { margin-left: auto; font-weight: 600; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; color: var(--text-2); }
.alert b { color: var(--text); }
.alert:last-child { border-bottom: none; }
.alert .ic { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 700; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; cursor: pointer; user-select: none; }
.toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
.filtros { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
input[type=search], select, input[type=password] { background: var(--card); border: 1px solid var(--border-2); border-radius: 10px; padding: 8px 12px; color: var(--text);
                             font: inherit; font-size: 13.5px; min-width: 220px; outline: none; transition: border-color .12s, box-shadow .12s; }
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.vazio { color: var(--muted); padding: 24px 0; text-align: center; }
.nota { color: var(--muted); font-size: 12.5px; margin-top: 10px; line-height: 1.55; }
.mais { background: var(--card); border: 1px solid var(--border-2); border-radius: 10px; padding: 8px 14px; cursor: pointer; margin-top: 14px; color: var(--text-2); font-weight: 500; }
.mais:hover { color: var(--text); }
.cartao-tile .uso { margin-top: 12px; }
.mes-btn { background: var(--card-2); border: 1px solid transparent; border-radius: 99px; padding: 5px 13px; cursor: pointer; color: var(--text-2); font-size: 13px; font-weight: 500; }
.mes-btn:hover { color: var(--text); border-color: var(--border-2); }
.mes-btn.on { background: var(--text); color: var(--bg); font-weight: 600; }
#detalheProv, #detalheParc, #detalheAss, #detalheRec { scroll-margin-top: 90px; }

/* ---------- resumo: destaque */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; padding: 28px 30px; }
.eyebrow { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.hero-val { font-size: 46px; font-weight: 680; letter-spacing: -.04em; line-height: 1.05; margin: 8px 0 8px; }
.hero-sub { color: var(--text-2); font-size: 13.5px; }
.hero-sub b { color: var(--text); font-weight: 600; }
.meta-box { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--grid); }
.meta-top { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; color: var(--text-2); flex-wrap: wrap; }
.meta-top b { color: var(--text); }
.meter { height: 10px; background: var(--card-2); border-radius: 99px; overflow: hidden; margin: 10px 0 10px; position: relative; }
.meter > div { height: 100%; border-radius: 99px; background: var(--accent); }
.meter.ok > div { background: var(--good); }
.meta-det { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.meta-det b { color: var(--text-2); }
.hero-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.mini-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mini-kpis div { background: var(--card-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.mini-kpis span { display: block; font-size: 11.5px; color: var(--muted); }
.mini-kpis b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }

/* ---------- carteira de cartões */
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 6px 2px -4px; }
.sec-head h2 { margin: 0; font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; }
.sec-head span { font-size: 13px; color: var(--muted); }
.sec-head a { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 500; }
.wallet { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.wcard { --c: var(--s1); position: relative; display: block; text-decoration: none; border-radius: var(--radius); padding: 18px 20px 18px; overflow: hidden;
         background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
.wcard::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
.wcard::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%;
                background: radial-gradient(circle, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%); pointer-events: none; }
.wcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.wtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.wname { font-size: 13px; font-weight: 600; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wval { font-size: 24px; font-weight: 680; letter-spacing: -.03em; margin: 10px 0 2px; }
.wdet { font-size: 12.5px; color: var(--muted); }
.wbar { height: 6px; background: var(--card-2); border-radius: 99px; overflow: hidden; margin: 14px 0 6px; }
.wbar div { height: 100%; background: var(--c); border-radius: 99px; }

/* ---------- lista estilo app */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.li:last-child { border-bottom: none; }
.li-ic { --c: var(--s1); width: 36px; height: 36px; border-radius: 11px; flex: none; display: grid; place-items: center; font-weight: 650; font-size: 13px;
         background: color-mix(in srgb, var(--c) 14%, var(--card)); color: var(--c); }
.li-main { flex: 1; min-width: 0; }
.li-t { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-v { font-weight: 600; font-size: 13.5px; white-space: nowrap; }

/* ---------- barra inferior e menu (celular) */
.tabbar { display: none; }
@media (min-width: 821px) { .sheet, .sheet-bg { display: none; } }
.sheet-bg { position: fixed; inset: 0; background: rgba(16,24,40,.32); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card); border-radius: 22px 22px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
         max-height: 82vh; overflow-y: auto; transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1); box-shadow: var(--shadow-lg); }
.sheet:not(.on) { visibility: hidden; transition: transform .25s, visibility 0s .25s; }
.sheet.on { transform: none; } .sheet-bg.on { opacity: 1; pointer-events: auto; }
.sheet .alca { width: 38px; height: 5px; border-radius: 99px; background: var(--border-2); margin: 4px auto 6px; }
.sheet h6 { margin: 14px 6px 6px; font-size: 11px; letter-spacing: .06em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.sheet .opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sheet a { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; background: var(--card-2); text-decoration: none; font-size: 14px; font-weight: 500; }
.sheet a.on { background: var(--accent-soft); color: var(--accent); }
.sheet a svg { width: 18px; height: 18px; flex: none; }
.sheet .rodape { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding: 0 4px; font-size: 12px; color: var(--muted); }

/* ---------- tela de senha */
.lock { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: var(--bg); }
.lock[hidden] { display: none; }
.lock form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 32px 28px; box-shadow: var(--shadow-lg); text-align: center; }
.lock .logo { width: 52px; height: 52px; border-radius: 15px; margin: 0 auto 16px; }
.lock h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
.lock p { margin: 6px 0 22px; color: var(--muted); font-size: 13.5px; }
.lock input[type=password] { width: 100%; min-width: 0; padding: 12px 14px; font-size: 16px; }
.lock .toggle { margin: 14px 0 18px; }
.lock button { width: 100%; border: none; border-radius: 12px; padding: 12px; background: var(--text); color: var(--bg); font-weight: 600; font-size: 15px; cursor: pointer; }
.lock button:disabled { opacity: .6; }
.lock .erro { color: var(--down); font-size: 13px; min-height: 18px; margin-top: 12px; }

@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr 1fr; }
  .hero { grid-template-columns: 1fr; gap: 22px; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { display: none; }
  header { padding: calc(12px + env(safe-area-inset-top)) 16px 12px; gap: 10px; }
  header h1 { font-size: 20px; }
  header p { display: none; }
  .mes b { min-width: 0; padding: 0 4px; font-size: 13px; }
  .mes button { width: 28px; height: 28px; }
  .so-mobile { display: grid; }
  .content { padding: 4px 16px calc(96px + env(safe-area-inset-bottom)); gap: 14px; }
  .grid { gap: 10px; }
  .g4, .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g2 { grid-template-columns: 1fr; }
  .g3 > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  .card { padding: 18px 16px; border-radius: 16px; }
  .kpi { padding: 14px 14px; }
  .kpi .val { font-size: 17.5px; }
  .kpi .det { font-size: 11.5px; }
  .hero { padding: 22px 18px; }
  .hero-val { font-size: 38px; }
  .mini-kpis b { font-size: 13.5px; }
  .chart { height: 240px; } .chart.alto { height: 270px; } .chart.mini { height: 130px; }
  .wallet { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
  .wallet::-webkit-scrollbar { display: none; }
  .wcard { flex: 0 0 82%; scroll-snap-align: center; }
  .bar-row { grid-template-columns: 96px 1fr auto; gap: 10px; font-size: 13px; }
  .tbl { margin: 0 -16px; padding: 0 6px; }
  .tbl table { min-width: 540px; }
  table { font-size: 13px; }
  input[type=search], select { min-width: 0; width: 100%; }
  .legend { grid-template-columns: 1fr; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
            border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 0; font-size: 10.5px; font-weight: 500;
            color: var(--muted); text-decoration: none; background: none; border: none; cursor: pointer; }
  .tabbar svg { width: 22px; height: 22px; }
  .tabbar .on { color: var(--accent); }
}
/* ================= v2: visual futurista ================= */
:root { --num: "Space Grotesk", "Inter", system-ui, sans-serif; --radius: 20px; }
.hero-val, .kpi .val, .wval, header h1, .anel b, .ritmo-val, .tl-data b, .card h2, .sec-head h2, .brand b { font-family: var(--num); }
.kpi .val { letter-spacing: -.02em; }
.hero-val { letter-spacing: -.035em; }
body { background:
  radial-gradient(900px 500px at 100% -10%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%),
  radial-gradient(700px 400px at -10% 110%, color-mix(in srgb, #06b6d4 6%, transparent), transparent 60%), var(--bg);
  background-attachment: fixed; }
aside { background: color-mix(in srgb, var(--side) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.logo { background: linear-gradient(135deg, #4f46e5, #06b6d4); color: #fff; box-shadow: 0 6px 16px -6px rgba(79,70,229,.6); }
nav a.on { background: var(--accent-soft); }
aside nav a.on::before { content: ""; width: 3px; height: 16px; border-radius: 3px; background: linear-gradient(#6366f1, #06b6d4); margin-left: -10px; margin-right: 7px; }
.card { transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--border-2); }
.kpi { position: relative; overflow: hidden; }
.kpi::after { content: ""; position: absolute; left: 20px; right: 20px; bottom: 0; height: 2px; border-radius: 2px;
              background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, transparent), transparent); opacity: .5; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--card-2); color: var(--text-2); }
.delta.ruim { background: var(--down-soft); color: var(--down); }
.delta.bom { background: var(--up-soft); color: var(--up); }
.bar-row small { color: var(--muted); font-weight: 400; }
.link { display: inline-block; margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; }
.link:hover { text-decoration: underline; }
.nota a { color: var(--accent); }

/* painel de comando */
.cmd { position: relative; overflow: hidden; border-radius: 24px; padding: 28px 30px; color: #eef1ff; isolation: isolate;
       background: radial-gradient(120% 150% at 0% 0%, #1c2360 0%, #0d1128 46%, #070914 100%);
       border: 1px solid rgba(129,140,248,.18); box-shadow: 0 24px 60px -28px rgba(30,35,110,.7), inset 0 1px 0 rgba(255,255,255,.06); }
.cmd::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
               background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
               background-size: 30px 30px; -webkit-mask-image: radial-gradient(ellipse 70% 90% at 75% 0%, #000 10%, transparent 75%); mask-image: radial-gradient(ellipse 70% 90% at 75% 0%, #000 10%, transparent 75%); }
.cmd::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
              background: radial-gradient(circle at 88% 10%, rgba(99,102,241,.42), transparent 42%), radial-gradient(circle at 100% 100%, rgba(6,182,212,.28), transparent 45%); }
.cmd .eyebrow { color: rgba(226,232,255,.62); text-transform: none; }
.cmd .hero-val { color: #fff; text-shadow: 0 0 32px rgba(129,140,248,.35); }
.cmd .hero-val.down { color: #ff8a80; text-shadow: 0 0 32px rgba(255,138,128,.3); }
.cmd .hero-sub { color: rgba(226,232,255,.72); }
.cmd .hero-sub b, .cmd .meta-top b, .cmd .meta-det b { color: #fff; }
.cmd .meta-box { border-top-color: rgba(255,255,255,.09); }
.cmd .meta-top, .cmd .meta-det { color: rgba(226,232,255,.66); }
.cmd .meter { background: rgba(255,255,255,.08); }
.cmd .meter > div { background: linear-gradient(90deg, #818cf8, #22d3ee); box-shadow: 0 0 18px rgba(34,211,238,.55); }
.cmd .meter.ok > div { background: linear-gradient(90deg, #34d399, #5eead4); }
.cmd .mini-kpis div { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.cmd .mini-kpis span { color: rgba(226,232,255,.6); }
.cmd .mini-kpis b { color: #fff; font-family: var(--num); }
.cmd .chip { background: rgba(255,255,255,.08); color: #e0e7ff; border: 1px solid rgba(255,255,255,.08); }

/* anéis de progresso */
.anel { position: relative; width: 128px; height: 128px; flex: none; }
.anel svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.anel circle { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray .6s; }
.anel circle + circle { filter: drop-shadow(0 0 6px rgba(129,140,248,.55)); }
.anel-fundo { stroke: var(--card-2); }
.cmd .anel-fundo { stroke: rgba(255,255,255,.08); }
.anel > div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15; }
.anel b { font-size: 23px; font-weight: 650; letter-spacing: -.02em; }
.anel span { font-size: 11px; color: var(--muted); margin-top: 2px; }
.cmd .anel span { color: rgba(226,232,255,.6); }
.aneis { display: flex; gap: 18px; justify-content: center; }
.ritmo { display: flex; gap: 22px; align-items: center; }
.ritmo-val { font-size: 30px; font-weight: 650; letter-spacing: -.03em; margin: 4px 0 6px; color: #fff; }
.ritmo .hero-sub { font-size: 12.5px; margin-top: 2px; }

/* linha do tempo */
.tl { display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.tl-item:last-child { border-bottom: none; }
.tl-data { --c: var(--s1); text-align: center; border-radius: 13px; padding: 6px 0 5px; line-height: 1.05; position: relative;
           background: color-mix(in srgb, var(--c) 11%, var(--card)); border: 1px solid color-mix(in srgb, var(--c) 25%, transparent); }
.tl-data b { display: block; font-size: 18px; font-weight: 650; color: var(--text); }
.tl-data span { font-size: 10.5px; color: var(--c); text-transform: uppercase; font-weight: 600; letter-spacing: .04em; }
.tl-sem { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 0; }
.tl-sem:first-child { margin-top: 0; }

/* objetivos */
.obj { padding: 12px 0; border-bottom: 1px solid var(--grid); }
.obj:last-child { border-bottom: none; }
.obj-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
.obj-top span { color: var(--muted); }
.obj .meter { margin: 8px 0 6px; height: 8px; }
.meter > div { background: linear-gradient(90deg, #6366f1, #06b6d4); }

/* tema escuro: painel um pouco mais profundo */
:root[data-theme="dark"] .cmd { background: radial-gradient(120% 150% at 0% 0%, #232b70 0%, #10153a 46%, #0a0d1f 100%); }
:root[data-theme="dark"] body { background: radial-gradient(900px 500px at 100% -10%, rgba(99,102,241,.12), transparent 60%), radial-gradient(700px 400px at -10% 110%, rgba(6,182,212,.08), transparent 60%), var(--bg); }

.dobra { border-top: 1px solid var(--grid); }
.dobra summary { display: flex; align-items: center; gap: 10px; padding: 13px 2px; cursor: pointer; list-style: none; font-size: 14px; }
.dobra summary::-webkit-details-marker { display: none; }
.dobra summary::after { content: "›"; color: var(--muted); font-size: 18px; transition: transform .15s; margin-left: 4px; }
.dobra[open] summary::after { transform: rotate(90deg); }
.dobra summary i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.dobra summary span { color: var(--muted); font-size: 12.5px; }
.dobra summary .num { margin-left: auto; }
.dobra .tbl { margin-bottom: 10px; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 820px) { .duas { grid-template-columns: 1fr; } }

const gastoTipo = (m, t) => t === 'Variável' ? sum(variaveisMes(m), l => l.valor)

// Busca por texto (nome, categoria...) ou por valor: "150" acha de 150,00 a 150,99; "150,9" ou "150.90" é mais exato;
// aceita "R$ 1.054,56". Sem acento e sem diferença de maiúsculas.
const semAcento = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function casaBusca(textos, valor) {
  const q = (st.busca || '').trim();
  if (!q) return true;
  if (textos.some(t => semAcento(t).includes(semAcento(q)))) return true;
  const num = q.replace(/r\$|\s/gi, '');
  if (valor == null || !/^\d[\d.,]*$/.test(num)) return false;
  let alvo = num.includes(',') ? num.replace(/\./g, '').replace(',', '.') : num;
  if (!num.includes(',') && /^\d{1,3}(\.\d{3})+$/.test(num)) alvo = num.replace(/\./g, '');  // 1.054 = mil e cinquenta e quatro
  const a = parseFloat(alvo), v = Math.abs(valor), dec = (alvo.split('.')[1] || '').length;

  if (dec === 0) return Math.floor(v + 1e-9) === a;
  if (dec === 1) return v.toFixed(2).startsWith(a.toFixed(1));

}

// Variáveis = tudo o que passou nos cartões menos parcelas, assinaturas, recorrentes e contas fixas pagas no cartão.
// Um estorno só abate quando devolve uma compra variável do mesmo estabelecimento feita no mesmo mês ou nos 2
// anteriores; cancelamento de parcela, ajuste de saldo e reembolso de compra antiga ficam de fora.
const fixasNoCartao = D.fixas.filter(f => f.noCartao && (f.conta || '').length >= 4).map(f => semAcento(f.conta));
const ehFixaCartao = l => fixasNoCartao.some(n => semAcento(l.desc).includes(n));
const compraVar = {}; for (const l of L) if (l.tipo === 'Variável' && l.valor > 0) (compraVar[chave(l.desc)] ||= new Set()).add(l.mes);
const estornoVariavel = l => l.tipo === 'Estorno/Crédito' && !/parc/i.test(l.desc) &&
  [0, -1, -2].some(k => (compraVar[chave(l.desc)] || new Set()).has(somaMes(l.mes, k)));
const variaveisMes = m => lancMes(m).filter(l => !ehFixaCartao(l) && (l.tipo === 'Variável' || estornoVariavel(l)));

  const conta = [['Total das faturas', totCartao], ['Parcelas', -porTipo('Parcelado')], ['Assinaturas', -porTipo('Assinatura')],
    ['Recorrentes', -porTipo('Recorrente')], ['Contas fixas pagas no cartão', -fixaCart],
    ['Outros créditos (cancelamento de parcela, ajustes, reembolsos antigos)', -estFora]];
  const porCat = {}; for (const l of v) porCat[l.cat] = (porCat[l.cat] || 0) + l.valor;
  const cats = Object.entries(porCat).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  const lojas = {}; for (const l of v) { const k = chave(l.desc); (lojas[k] ||= {nome: l.desc, n: 0, v: 0}); lojas[k].n++; lojas[k].v += l.valor; }
  const topLojas = Object.values(lojas).sort((a, b) => b.v - a.v).slice(0, 10);

  </div>

  <div class="grid g2">

const fimParcela = (m, parc) => { const [k, n] = (parc || '1/1').split('/').map(Number); return somaMes(m, n - k); };

P.recorrentes = () => {
  const G = D.grupos || [];
  const ms = G.length ? Object.keys(G[0].porMes) : [];
  const fechados = ms.filter(m => m < D.mesAtual);
  const total = sum(G, g => g.provisao);
  if (!ms.includes(st.recMes)) st.recMes = fechados.length ? fechados[fechados.length - 1] : ms[ms.length - 1];
  setTimeout(() => grafico('gGrupos', {type: 'bar', stacked: true, aoClicar: i => irParaMesRec(ms[i]), data: {labels: ms.map(mesCurto),
    datasets: G.map((g, i) => ds(g.nome, ms.map(m => g.porMes[m] || 0), i, {backgroundColor: ms.map(m => m === st.recMes ? SERIE(i) : SERIE(i) + '66')}))}}));
  // despesas do mês escolhido, agrupadas por grupo
  const doMes = G.map((g, i) => ({g, i, its: (g.lancamentos || []).filter(x => x.mes === st.recMes && casaBusca([x.descricao, x.origem, g.nome], x.valor)).sort((a, b) => b.valor - a.valor)}));
  const totMes = sum(doMes, d => sum(d.its, x => x.valor));
  const blocosMes = doMes.map(({g, i, its}) => {
    const t = sum(its, x => x.valor), acima = g.media > 0 && t > g.media * 1.15;
    return `<tr><td colspan="4" style="padding-top:18px"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${SERIE(i)};margin-right:8px"></i><b>${esc(g.nome)}</b> <span class="dim">· ${its.length} despesas · ${brl(t)} · média ${brl0(g.media)}</span> ${acima ? chip('warning', 'acima da média') : ''}</td></tr>` +
      (its.length ? its.map(x => `<tr><td class="dim">${x.data ? dataBR(x.data) : '–'}</td><td>${esc(x.descricao)}</td><td class="dim">${esc(x.origem)}</td><td class="num">${brl(x.valor)}</td></tr>`).join('')
                  : `<tr><td colspan="4" class="dim" style="padding-left:30px">Nenhuma despesa neste mês.</td></tr>`);
  }).join('');
  // possíveis recorrentes que ficaram fora: mesmo estabelecimento em 3+ dos últimos 4 meses, sem grupo nem assinatura
  const ult4 = fechados.slice(-4), cand = {};
  for (const l of L.filter(l => l.tipo === 'Variável' && ult4.includes(l.mes) && l.valor > 0)) {
    const k = chave(l.desc); (cand[k] ||= {nome: l.desc, cat: l.cat, meses: new Set(), total: 0}); cand[k].meses.add(l.mes); cand[k].total += l.valor;
  }
  // o que você excluiu de propósito (-palavra) não volta como sugestão
  const excluidos = G.flatMap(g => g.palavras.split(',').map(p => p.trim()).filter(p => p.startsWith('-')).map(p => chave(p.slice(1))));
  const fora = Object.values(cand).filter(c => c.meses.size >= 3 && !excluidos.some(x => x && chave(c.nome).replace(/ /g, '').includes(x.replace(/ /g, ''))))

  <div class="card" id="detalheRec">

    <div class="card-head" style="margin-top:16px"><div><h2>${mesNome(st.recMes)}</h2><div class="sub">${sum(doMes, d => d.its.length)} despesas · ${brl(totMes)}${st.recMes >= D.mesAtual ? ' · mês em andamento' : ''}</div></div>
      <input type="search" id="busca" placeholder="Buscar nome ou valor neste mês" value="${esc(st.busca)}"></div>

  </div>
  ${card('Grupos', 'Edite na aba Recorrentes do Financas.xlsx: palavras-chave, valor fixo (vazio = média) e meses da média. Clique num grupo para ver os estabelecimentos dos 6 meses.', tabela(['Grupo', ...ms.map(m => '#' + mesCurto(m)), '#Média', '#Provisão', 'Base'],
    G.flatMap((g, i) => [`<tr style="cursor:pointer" data-grupo="${i}"><td><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${SERIE(i)};margin-right:8px"></i><b>${esc(g.nome)}</b> <span class="dim">${aberto === i ? '▾' : '▸'}</span></td>${ms.map(m => `<td class="num${m === st.recMes ? '" style="background:var(--accent-soft);font-weight:600' : ' dim'}">${brl0(g.porMes[m] || 0)}</td>`).join('')}<td class="num">${brl0(g.media)}</td><td class="num"><b>${brl0(g.provisao)}</b></td><td class="dim">${esc(g.base)}</td></tr>`,
      ...(aberto === i ? (g.itens.length ? g.itens.map(it => `<tr><td colspan="${ms.length + 1}" class="dim" style="padding-left:30px">${esc(it.descricao)} <span class="chip">${esc(it.origem)}</span></td><td class="num dim">${it.n}×</td><td class="num">${brl0(it.total)}</td><td class="dim">6 meses</td></tr>`) : [`<tr><td colspan="${ms.length + 4}" class="vazio">Nada encontrado com essas palavras-chave.</td></tr>`]) : [])]),
    `<tfoot><tr><td>Total</td>${ms.map(m => `<td class="num">${brl0(sum(G, g => g.porMes[m] || 0))}</td>`).join('')}<td class="num">${brl0(sum(G, g => g.media))}</td><td class="num">${brl0(total)}</td><td></td></tr></tfoot>`))}
  ${card('Ficou algo para trás?', 'Estabelecimentos que aparecem em 3 ou mais dos últimos 4 meses e ainda não estão em nenhum grupo nem nas assinaturas. Se for recorrente, acrescente uma palavra-chave na aba Recorrentes.',

};

P.pagamentos = m => {
  const saidas = movMes(m).filter(x => x.valor < 0 && x.classe !== 'interna');
  const usadas = new Set();
  const linhas = fixasMes(m).sort((a, b) => b.valor - a.valor).map(f => {
    const i = saidas.findIndex((x, j) => !usadas.has(j) && Math.abs(-x.valor - f.valor) <= Math.max(2, f.valor * 0.03));
    if (i >= 0) usadas.add(i);
    return {f, mov: i >= 0 ? saidas[i] : null};
  }).sort((a, b) => (a.f.dia || 99) - (b.f.dia || 99));
  // o "Pago" da sua planilha manda; a busca nos bancos é só confirmação
  const status = l => l.f.mes_ref === m && l.f.pago !== null && l.f.pago !== undefined ? (l.f.pago ? 'pago' : 'aberto') : (l.mov ? 'banco' : 'sem');
  const temPlanilha = linhas.some(l => ['pago', 'aberto'].includes(status(l)));
  const pagas = linhas.filter(l => ['pago', 'banco'].includes(status(l))), abertas = linhas.filter(l => ['aberto', 'sem'].includes(status(l)));
  const rotulo = {pago: chip('good', 'Pago'), aberto: chip('warning', 'A pagar'), banco: chip('good', 'Encontrado no banco'), sem: chip('warning', 'Sem informação')};
  return `
  <div class="grid g4">
    ${kpi('Pagas', `${pagas.length} de ${linhas.length}`, brl(sum(pagas, l => l.f.valor)))}
    ${kpi('Em aberto', brl(sum(abertas, l => l.f.valor)), `${abertas.length} conta${abertas.length === 1 ? '' : 's'}`, abertas.length ? 'down' : '')}
    ${kpi('Total do mês', brl(fixasTotal(m)), 'contas fixas fora do cartão')}
    ${kpi('% da renda', pct(fixasTotal(m) / (rendaDe(m) || 1)), 'comprometida antes dos cartões')}
  </div>
  ${card('Contas do mês', temPlanilha ? 'Situação pela coluna Pagamento da sua planilha (aba do mês). A coluna ao lado mostra a saída correspondente nas contas correntes, quando encontrada (mesmo valor ±3%).' : `Sua planilha não tem aba de ${mesNome(m)} com a coluna Pagamento; a situação vem da busca nas contas correntes (mesmo valor ±3%), que é uma estimativa.`,
    tabela(['Dia', 'Conta', '#Valor', 'Situação', 'Encontrado nas contas correntes'],
    linhas.map(l => `<tr><td class="dim">${l.f.dia || '–'}</td><td>${esc(l.f.conta)}</td><td class="num">${brl(l.f.valor)}</td><td>${rotulo[status(l)]}</td><td class="dim">${l.mov ? `${dataBR(l.mov.data)} · ${esc(D.bancos[l.mov.banco].nome)} · ${esc(l.mov.desc)}` : '–'}</td></tr>`)))}`;
};

// saldo de uma conta no último dia do mês = saldo atual − tudo o que entrou/saiu depois
const fimMes = mes => mes + '-31';
const saldoFim = (b, mes) => D.bancos[b].saldo - sum(M.filter(x => x.banco === b && x.data > fimMes(mes)), x => x.valor);

P.fluxo = m => {
  const reais = movMes(m).filter(x => !x.transf);   // transferências entre contas conectadas se anulam
  const ent = sum(reais.filter(x => x.valor > 0), x => x.valor), sai = -sum(reais.filter(x => x.valor < 0), x => x.valor);
  const lista = movMes(m).filter(movVisivel).filter(x => casaBusca([x.desc, x.cat], x.valor));
  const ms = D.meses.filter(x => x <= D.mesAtual);
  setTimeout(() => grafico('gFluxo', {type: 'bar', data: {labels: ms.map(mesCurto), datasets: [
    ds('Entradas', ms.map(x => sum(movMes(x).filter(y => !y.transf && y.valor > 0), y => y.valor)), 0),
    ds('Saídas', ms.map(x => -sum(movMes(x).filter(y => !y.transf && y.valor < 0), y => y.valor)), 1)]}}));
  const agrupar = sinal => { const g = {}; for (const x of reais.filter(x => sinal * x.valor > 0)) g[x.cat] = (g[x.cat] || 0) + Math.abs(x.valor); return Object.entries(g).sort((a, b) => b[1] - a[1]); };
  const gSai = agrupar(-1), gEnt = agrupar(1);
  const fim = D.bancos.map((b, i) => ({nome: b.nome, v: saldoFim(i, m), ini: saldoFim(i, somaMes(m, -1))})).filter(b => Math.abs(b.v) > 0.004 || Math.abs(b.ini) > 0.004 || movMes(m).some(x => D.bancos[x.banco].nome === b.nome));
  const nTransf = movMes(m).filter(x => x.transf).length;
  return `
  <div class="grid g4">
    ${kpi('Entradas', brl(ent), 'tudo o que entrou nas contas', 'up')}
    ${kpi('Saídas', brl(sai), 'inclui faturas de cartão pagas')}
    ${kpi('Resultado do mês', brl(ent - sai), 'variação do saldo das contas no mês', ent - sai < 0 ? 'down' : 'up')}
    ${kpi(m >= D.mesAtual ? 'Saldo atual nas contas' : `Saldo no fim de ${mesCurto(m)}`, brl(sum(fim, b => b.v)), fim.map(b => `${esc(b.nome)}: ${brl0(b.v)}`).join(' · '))}
  </div>
  <div class="grid g2">
    ${card('Para onde foi o dinheiro', `Saídas de ${mesNome(m)}`, barras(gSai.map(([c, v]) => ({rot: c, v, cor: 'var(--s2)'})), gSai.length ? gSai[0][1] : 1))}
    ${card('De onde veio', `Entradas de ${mesNome(m)}`, barras(gEnt.map(([c, v]) => ({rot: c, v})), gEnt.length ? gEnt[0][1] : 1))}
  </div>
  ${card('Saldo por conta', `Início e fim de ${mesNome(m)}`, tabela(['Conta', '#Saldo inicial', '#Entradas', '#Saídas', '#Saldo final'],
    fim.map((b, k) => { const idx = D.bancos.findIndex(x => x.nome === b.nome); const mv = movMes(m).filter(x => x.banco === idx);
      return `<tr><td>${esc(b.nome)}</td><td class="num">${brl(b.ini)}</td><td class="num up">${brl(sum(mv.filter(x => x.valor > 0), x => x.valor))}</td><td class="num">${brl(-sum(mv.filter(x => x.valor < 0), x => x.valor))}</td><td class="num">${brl(b.v)}</td></tr>`; }),
    `<tfoot><tr><td>Total</td><td class="num">${brl(sum(fim, b => b.ini))}</td><td></td><td></td><td class="num">${brl(sum(fim, b => b.v))}</td></tr></tfoot>`))}
  ${card('Entradas e saídas por mês', 'Sem as transferências entre suas contas conectadas', '<div class="chart"><canvas id="gFluxo"></canvas></div>')}
  ${card('Movimentações', `${lista.length} lançamentos`, tabela(['Data', 'Banco', 'Descrição', 'Categoria', '#Valor'],
    lista.slice(0, st.limite).map(x => `<tr><td class="dim">${dataBR(x.data)}</td><td class="dim">${esc(D.bancos[x.banco].nome)}</td><td>${esc(x.desc)}${x.transf ? ' <span class="chip">entre contas</span>' : x.classe === 'empresa' ? ' <span class="chip">empresa</span>' : ''}</td><td class="dim">${esc(x.cat)}</td><td class="num ${valorCls(x.valor)}">${x.valor > 0 ? '+ ' : ''}${brl(x.valor)}</td></tr>`))
    + (lista.length > st.limite ? '<button class="mais" data-mais>Mostrar mais</button>' : ''),
    `<div class="filtros"><input type="search" id="busca" placeholder="Buscar nome ou valor (ex.: 150,90)" value="${esc(st.busca)}">
      <label class="toggle"><input type="checkbox" id="tInternas" ${st.internas ? 'checked' : ''}>Mostrar transferências entre suas contas conectadas (${nTransf})</label></div>`)}
  <div class="nota">Ficam ocultas só as transferências que saem de uma conta conectada e entram em outra (se anulam). Pagamentos de fatura, Pix para outras contas suas ou da família, aplicações e movimentações das empresas aparecem, porque mudam o saldo.</div>`;
};

// Datas da fatura que vence no mês m: exatas da Pluggy quando o banco já fechou; senão, pelo dia configurado
// (último dia de compra que ainda entra na fatura) e dia de vencimento.
const SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const dataSem = s => { const d = new Date(s + 'T12:00'); return `${s.slice(8, 10)}/${s.slice(5, 7)} (${SEM[d.getDay()]})`; };
const diaMes = (mes, dia) => `${mes}-${String(Math.min(dia, new Date(+mes.slice(0, 4), +mes.slice(5, 7), 0).getDate())).padStart(2, '0')}`;
function datasFatura(c, m) {
  const f = (c.fechadas || []).find(x => x.vencimento.slice(0, 7) === m);
  if (f && f.fechamento) {
    const ult = new Date(f.fechamento + 'T12:00'); ult.setDate(ult.getDate() - 1);
    const ultS = `${ult.getFullYear()}-${String(ult.getMonth() + 1).padStart(2, '0')}-${String(ult.getDate()).padStart(2, '0')}`;
    return `compras até ${dataSem(ultS)} · fechou ${dataSem(f.fechamento)} · vence ${dataSem(f.vencimento)} <span class="chip">datas do banco</span>`;
  }
  const mesCorte = c.vencimento <= c.fechamento ? somaMes(m, -1) : m;
  return `compras até ${dataSem(diaMes(mesCorte, c.fechamento))} · vence ${dataSem(diaMes(m, c.vencimento))} <span class="chip">previsto</span>`;
}
P.cartoes = m => {
  const ms = D.meses.filter(x => x <= somaMes(D.mesAtual, 1));
  setTimeout(() => grafico('gFat', {type: 'bar', data: {labels: ms.map(mesCurto), datasets: D.cartoes.map((c, i) => ds(c.nome, ms.map(x => faturaExata(x, i)), i))}}));
  const previstas = D.projecao.filter(p => p.mes === m).map(p => ({data: '', mes: m, cartao: p.cartao, desc: p.descricao, valor: p.valor, tipo: 'Parcelado', parcela: p.parcela, cat: p.categoria, prevista: true}));
  const lista = [...lancMes(m), ...previstas].filter(l => (st.cartao < 0 || l.cartao === st.cartao) && casaBusca([l.desc, l.cat, l.tipo], l.valor)).sort((a, b) => b.data.localeCompare(a.data));
  const tiles = D.cartoes.map((c, i) => {
    const fat = faturaExata(m, i), soma = faturaMes(m, i), banco = faturaBanco(m, i);
    const uso = c.limite && c.usado != null ? c.usado / c.limite : null;
    return `<div class="card kpi cartao-tile"><div class="rot"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${SERIE(i)};margin-right:6px"></i>${esc(c.nome)}</div>
      <div class="val">${brl(fat)}</div>
      <div class="det">${banco != null ? `fatura fechada: valor exato da Pluggy${Math.abs(banco - soma) >= 0.01 ? ` · lançamentos recebidos somam ${brl(soma)}` : ''}` : m >= D.mesAtual ? 'fatura em aberto: soma dos lançamentos recebidos e das parcelas (a Pluggy só informa o total depois que fecha)' : 'soma dos lançamentos recebidos'}</div>
      <div class="det">${datasFatura(c, m)}</div>
      ${c.usado != null ? `<div class="det" style="margin-top:8px">total devido no cartão hoje (Pluggy): <b>${brl(c.usado)}</b></div>` : ''}
      ${uso !== null ? `<div class="uso"><div class="track"><div style="width:${Math.min(100, uso * 100)}%;background:${SERIE(i)}"></div></div><div class="det" style="margin-top:6px">${pct(uso)} de ${brl0(c.limite)} de limite usado</div></div>` : '<div class="det" style="margin-top:12px">limite não informado pelo banco</div>'}</div>`;
  }).join('');
  return `
  <div class="grid g3">${tiles}</div>
  ${card('Faturas por mês', 'Mês em que a fatura vence', '<div class="chart alto"><canvas id="gFat"></canvas></div>')}
  ${card('Lançamentos da fatura', `${lista.length} lançamentos · ${brl(sum(lista, l => l.valor))} · toque na categoria para trocar`, avisoAJ() + tabela(['Data', 'Descrição', 'Tipo', 'Categoria', 'Cartão', '#Valor'],
    lista.slice(0, st.limite).map(l => `<tr><td class="dim">${l.prevista ? '–' : dataBR(l.data)}</td><td>${esc(l.desc)}${l.parcela ? ` <span class="chip">${l.parcela}</span>` : ''}${l.prevista ? ` ${chip('warning', 'prevista: chega quando a fatura fechar')}` : ''}</td><td class="dim">${l.tipo}</td><td class="dim">${selCat(l)}</td><td class="dim">${esc(D.cartoes[l.cartao].nome)}</td><td class="num ${valorCls(-l.valor)}">${brl(l.valor)}</td></tr>`))
    + (lista.length > st.limite ? '<button class="mais" data-mais>Mostrar mais</button>' : ''),
    `<div class="filtros"><select id="selCartao"><option value="-1">Todos os cartões</option>${D.cartoes.map((c, i) => `<option value="${i}" ${st.cartao === i ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select>
     <input type="search" id="busca" placeholder="Buscar nome ou valor (ex.: 150,90)" value="${esc(st.busca)}"></div>`)}`;
};

const PV = (D.provisoes || []).map(p => ({mes: p[0], tipo: p[1], desc: p[2], detalhe: p[3], origem: p[4], cat: p[5], valor: p[6]}));
const TIPOS_PROV = ['Parcela', 'Assinatura', 'Recorrente', 'Conta fixa'];

  const blocos = TIPOS_PROV.map(t => {

    return `<tr><td colspan="4" style="padding-top:18px"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${SERIE(TIPOS_PROV.indexOf(t))};margin-right:8px"></i><b>${titulos[t]}</b> <span class="dim">· ${its.length} itens · ${brl(sum(its, p => p.valor))}</span></td></tr>` +

  }).join('');
  const abas = `<div class="filtros" style="gap:6px">${ms.map(m => `<button class="mes-btn${m === st.provMes ? ' on' : ''}" data-prov="${m}">${mesCurto(m)}</button>`).join('')}</div>`;
  const detalhe = `<div class="card" id="detalheProv">
    <div class="card-head"><div><h2>O que está comprometido em cada mês</h2><div class="sub">Escolha o mês para ver cada parcela, assinatura, recorrente e conta fixa · ${itens.length} itens em ${mesNome(st.provMes)} · ${pct(sel.total / (rendaDe(st.provMes) || 1))} da renda · livre ${brl(rendaDe(st.provMes) - sel.total)}</div></div>
      <input type="search" id="busca" placeholder="Buscar nome ou valor neste mês" value="${esc(st.busca)}"></div>
    ${abas}
<div style="height:10px"></div>
    ${TIPOS_PROV.map((t, i) => { const its = itens.filter(p => p.tipo === t).sort((a, b) => b.valor - a.valor); if (!its.length) return '';

  </div>`;
  if (soDetalhe) return detalhe;
  return `
  <div class="grid g4">
    ${kpi(`Comprometido em ${mesCurto(prox.m)}`, brl(prox.total), `${pct(prox.total / (rendaDe(prox.m) || 1))} da renda ${prox.total / rendaDe(prox.m) > .7 ? chip('critical', 'acima de 70%') : prox.total / rendaDe(prox.m) > .5 ? chip('warning', 'atenção') : chip('good', 'ok')}`)}

    ${kpi('Total nos próximos 12 meses', brl(tot), `média de ${brl0(tot / res.length)} por mês`)}

// ---------- painel principal: Hoje, Mês, Pela frente, Metas
const HOJE = (D.geradoIso || new Date().toISOString()).slice(0, 10);
const isoData = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const maisDias = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return isoData(d); };
const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
const diasNoMes = mes => new Date(+mes.slice(0, 4), +mes.slice(5, 7), 0).getDate();
const SEM_LONGO = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const ultimaCompra = L.filter(l => l.data <= HOJE && l.tipo !== 'Parcelado').reduce((a, l) => l.data > a ? l.data : a, '');
const ultimoBanco = M.reduce((a, m) => m.data > a ? m.data : a, '');
const frescor = () => `<span class="chip"><i style="background:var(--good)"></i>dados até: cartões ${ultimaCompra ? dataBR(ultimaCompra) : '–'} · bancos ${ultimoBanco ? dataBR(ultimoBanco) : '–'}</span>`;
// gasto total nos cartões, por dia: compras novas + parcelas que caíram naquele dia (sem estornos e sem parcelas futuras)
const diaADia = mes => L.filter(l => l.data.slice(0, 7) === mes && l.valor > 0 && l.data <= HOJE);
const acumulado = mes => { const v = Array(diasNoMes(mes)).fill(0); for (const l of diaADia(mes)) v[+l.data.slice(8, 10) - 1] += l.valor; let s = 0; return v.map(x => s += x); };
const anel = (p, cor, txt, sub) => { const r = 42, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, p || 0));
  return `<div class="anel"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" class="anel-fundo"/><circle cx="50" cy="50" r="${r}" style="stroke:${cor};stroke-dasharray:${c * v} ${c}"/></svg><div><b>${txt}</b><span>${sub}</span></div></div>`; };
const delta = (v, ref, inverso = true) => { if (!ref) return ''; const d = v / ref - 1, ruim = inverso ? d > 0.02 : d < -0.02, bom = inverso ? d < -0.02 : d > 0.02;
  return `<span class="delta ${ruim ? 'ruim' : bom ? 'bom' : ''}">${d > 0 ? '▲' : d < 0 ? '▼' : '•'} ${pct(Math.abs(d))}</span>`; };

// faturas que vencem entre hoje e daqui a N dias (datas do banco quando a fatura já fechou)
function vencimentos(dias) {
  const lim = maisDias(HOJE, dias), out = [];
  for (const mes of [somaMes(D.mesAtual, -1), D.mesAtual, somaMes(D.mesAtual, 1), somaMes(D.mesAtual, 2)]) D.cartoes.forEach((c, i) => {
    const f = (c.fechadas || []).find(x => x.vencimento.slice(0, 7) === mes);
    const d = f ? f.vencimento : c.vencimento ? diaMes(mes, c.vencimento) : '';
    if (d && d >= HOJE && d <= lim) out.push({data: d, desc: `Fatura ${c.nome}`, valor: faturaExata(mes, i), cor: SERIE(i), exato: faturaBanco(mes, i) != null, mes});
  });
  for (const mes of [D.mesAtual, somaMes(D.mesAtual, 1), somaMes(D.mesAtual, 2)]) {
    const porDia = {};
    for (const f of fixasMes(mes)) {
      if (!f.dia || fixaPaga(f, mes)) continue;
      const d = diaMes(mes, f.dia);
      if (d > lim || (d < HOJE && mes !== D.mesAtual)) continue;  // vencidas do mês atual continuam aparecendo
      (porDia[d] ||= []).push(f);
    }
    for (const [d, fs] of Object.entries(porDia)) out.push({data: d, fixa: true, mes, n: fs.length, cor: 'var(--s4)', valor: sum(fs, f => f.valor),
      desc: fs.length === 1 ? fs[0].conta : `${fs.length} contas fixas`, nomes: fs.map(f => f.conta).join(', '), previsto: mes !== fs[0].mes_ref});
  }
  return out.sort((a, b) => a.data.localeCompare(b.data));
}
// contas fixas: baixa pela coluna Pagamento da planilha (sim = paga; em branco = a pagar)
// data e hora em que os bancos informaram o saldo ao Meu Pluggy (o mais antigo entre as contas com saldo)
const saldoEm = () => { const ts = D.bancos.filter(b => b.em && Math.abs(b.saldo) > 0.5).map(b => new Date(b.em)).filter(d => !isNaN(d)); if (!ts.length) return '';
  const d = new Date(Math.min(...ts)), p = n => String(n).padStart(2, '0'), horas = (Date.now() - d) / 36e5;
  return ` <span${horas > 20 ? ' style="color:#ffb86b"' : ''}>informado pelos bancos em ${p(d.getDate())}/${p(d.getMonth() + 1)} às ${p(d.getHours())}:${p(d.getMinutes())}</span>`; };
const fixaPaga = (f, m) => f.mes_ref === m && f.pago === true;
const fixasStatus = m => { const fs = fixasMes(m), pagas = fs.filter(f => fixaPaga(f, m)), abertas = fs.filter(f => !fixaPaga(f, m));
  const vencidas = m === D.mesAtual ? abertas.filter(f => f.dia && diaMes(m, f.dia) < HOJE) : m < D.mesAtual ? abertas : [];
  return {fs, pagas, abertas, vencidas, temControle: fs.some(f => f.mes_ref === m && f.pago !== null && f.pago !== undefined),
          vPagas: sum(pagas, f => f.valor), vAbertas: sum(abertas, f => f.valor), vVencidas: sum(vencidas, f => f.valor)}; };
// parcelas que terminam: dinheiro que volta para o orçamento no mês seguinte
const alivios = () => MESES_PARC.map(m => { const t = parcelasDoMes(m).filter(x => x.fim === m); return {m, livre: somaMes(m, 1), n: t.length, v: sum(t, x => x.valor), its: t}; }).filter(a => a.v > 1);

function alertasDe(m) {

// ---------- Principal x adicional: separa os gastos pelo final do cartão
const ADIC = D.adicional || {}, FINAIS_AD = new Set((ADIC.finais || []).map(String));
const NOME_AD = ADIC.nome || 'Adicional', NOME_TIT = ADIC.titular || 'Principal';
const ehAdicional = x => FINAIS_AD.has(String(x.final || ''));
const COR_TIT = () => css('--s1'), COR_AD = () => css('--s5');
function divisaoMes(m) {
  const ls = lancMes(m), pv = D.projecao.filter(p => p.mes === m);
  const porCartao = D.cartoes.map((c, i) => {
    const ad = sum(ls.filter(l => l.cartao === i && ehAdicional(l)), l => l.valor) + sum(pv.filter(p => p.cartao === i && ehAdicional(p)), p => p.valor);
    const tot = faturaExata(m, i);
    return {nome: c.nome, i, ad, tit: tot - ad, tot};
  });
  return {porCartao, ad: sum(porCartao, c => c.ad), tit: sum(porCartao, c => c.tit), tot: sum(porCartao, c => c.tot)};
}
P.adicional = m => {

  const futurasAd = sum(D.projecao.filter(p => p.mes > m && ehAdicional(p)), p => p.valor);

  const finaisTxt = D.cartoes.map((c, i) => { const f = [...new Set(L.filter(l => l.cartao === i && ehAdicional(l)).map(l => l.final))]; return f.length ? `${esc(c.nome.split(' ')[0])} final ${f.join(', ')}` : ''; }).filter(Boolean).join(' · ');

const totFaturaAd = x => sum(lancMes(x), l => l.valor) + sum(D.projecao.filter(p => p.mes === x), p => p.valor);

  ${card('Parcelas nos próximos 12 meses', 'O que já está comprometido nos cartões adicionais', '<div class="chart"><canvas id="gAdParc"></canvas></div>')}
  ${card('Compras parceladas ativas', `Parcelas em ${mesNome(ms[0])}`, tabela(['Compra', 'Cartão', 'Parcela', 'Termina', '#Valor'],
    ativas.map(p => `<tr><td>${esc(p.desc)}</td><td class="dim">${esc(D.cartoes[p.cartao].nome)}</td><td class="dim">${esc(p.parcela)}</td><td class="dim">${mesCurto(p.fim)}</td><td class="num">${brl(p.valor)}</td></tr>`),
    `<tfoot><tr><td colspan="4">Total</td><td class="num">${brl(porMes[0] || 0)}</td></tr></tfoot>`))}`;
};

P.adLanc = m => {
  const ls = [...lancMes(m)].filter(l => casaBusca([l.desc, l.cat, D.cartoes[l.cartao].nome, l.final], l.valor)).sort((a, b) => b.data.localeCompare(a.data));
  return card(`Lançamentos de ${mesNome(m)}`, `${ls.length} lançamentos nas faturas do mês · ${brl(sum(ls, l => l.valor))}`,
    `<div class="filtros" style="margin-bottom:10px"><input type="search" id="busca" placeholder="Buscar nome, categoria ou valor" value="${esc(st.busca)}"></div>` +
    tabela(['Data', 'Descrição', 'Cartão', 'Categoria', '#Valor'], ls.map(l => `<tr><td class="dim">${dataBR(l.data)}</td><td>${esc(l.desc)}${l.parcela ? ` <span class="chip">${esc(l.parcela)}</span>` : ''}</td><td class="dim">${esc(D.cartoes[l.cartao].nome)} · ${esc(l.final)}</td><td class="dim">${esc(l.cat)}</td><td class="num">${brl(l.valor)}</td></tr>`)));
};

P.resumo = P.mes;
P.historico = () => {
  const b = P.balanco(), e = P.evolucao(true), k = b.lastIndexOf('<div class="card"', b.indexOf('<h2>Balanço mensal'));
  return b.slice(0, k) + e + b.slice(k);
};
// Contas fixas = vencimentos + baixa de pagamento + divisão por categoria
P.fixas = m => {
  const porCat = {}; for (const f of fixasMes(m)) porCat[f.categoria] = (porCat[f.categoria] || 0) + f.valor;
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  return P.pagamentos(m) + card('Por categoria', `${pct(fixasTotal(m) / (rendaDe(m) || 1))} da renda vai para contas fixas · dívidas e financiamentos: ${brl0(dividasMes(m))}`, barras(cats.map(([c, v]) => ({rot: c, v})), cats.length ? cats[0][1] : 1));
};
// Assinaturas e recorrentes na mesma página
P.assinaturas_ = P.assinaturas;
P.assinaturas = () => `<div class="sec-head"><div><h2>Assinaturas</h2><span>cobranças de preço fixo</span></div></div>${P.assinaturas_()}
  <div class="sec-head" style="margin-top:14px"><div><h2>Recorrentes</h2><span>combustível, mercado, farmácia, seguros, academias, beleza</span></div></div>${P.recorrentes()}`;

// ---------- navegação e renderização
function info(pag) { for (const [, itens] of PAGINAS) for (const it of itens) if (it[0] === pag) return it; return PAGINAS[0][1][0]; }
const AD_ICON = {adHoje: 'hoje', adMes: 'mes', adParcelas: 'parcelas', adLanc: 'cartoes'};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[AD_ICON[k] || k]}</svg>`;
const TAB = MODO_AD ? [['adHoje','Hoje'],['adMes','Mês'],['adParcelas','Parcelas'],['adLanc','Lançamentos']] : [['hoje','Hoje'],['mes','Mês'],['frente','Pela frente'],['metas','Metas']];
function abrirMenu(on) { document.getElementById('sheet').classList.toggle('on', on); document.getElementById('sheetBg').classList.toggle('on', on); }
function render() {
  graficos.forEach(g => g.destroy()); graficos = [];
  const [id, nome, sub] = info(st.pag);
  const naTab = TAB.some(t => t[0] === id);
  document.getElementById('tabbar').innerHTML = TAB.map(([k, n]) => `<a href="#${k}" class="${k === id ? 'on' : ''}">${svg(k)}${n}</a>`).join('')
    + `<button id="btnMais" class="${naTab ? '' : 'on'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>${naTab ? 'Mais' : esc(nome.split(' ')[0])}</button>`;
  document.getElementById('sheet').innerHTML = '<div class="alca"></div>' + PAGINAS.map(([sec, itens]) => `<h6>${sec}</h6><div class="opcoes">` + itens.map(([k, n]) =>
    `<a href="#${k}" class="${k === id ? 'on' : ''}">${svg(k)}${n}</a>`).join('') + '</div>').join('')
    + `<div class="rodape"><span>Atualizado ${D.gerado}</span><button class="icon-btn" id="tema2" aria-label="Alternar tema"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>`;
  document.getElementById('btnMais').onclick = () => abrirMenu(true);
  document.getElementById('tema2').onclick = () => document.getElementById('tema').click();
  document.querySelectorAll('#sheet a').forEach(a => a.onclick = () => abrirMenu(false));
  document.getElementById('nav').innerHTML = PAGINAS.map(([sec, itens]) => `<h6>${sec}</h6>` + itens.map(([k, n]) =>
    `<a href="#${k}" class="${k === st.pag ? 'on' : ''}">${svg(k)}${n}</a>`).join('')).join('');
  document.getElementById('titulo').textContent = nome;
  document.getElementById('subtitulo').textContent = MENSAL.has(id) ? `${sub} · ${MESES[+st.mes.slice(5, 7) - 1]}` : sub;
  const mensal = MENSAL.has(id);
  document.getElementById('mesNav').style.visibility = mensal ? 'visible' : 'hidden';
  document.getElementById('mesNome').textContent = innerWidth <= 820 ? mesCurto(st.mes) : mesNome(st.mes);
  document.getElementById('mesAnt').disabled = st.mes <= D.meses[0];
  document.getElementById('mesProx').disabled = st.mes >= D.meses[D.meses.length - 1];
  document.getElementById('conteudo').innerHTML = P[id](st.mes);
  ligar();
}
function ligar() {
  const b = document.getElementById('busca');
  if (b) b.oninput = () => { st.busca = b.value; st.limite = 60; const pos = b.selectionStart; render(); const n = document.getElementById('busca'); n.focus(); n.setSelectionRange(pos, pos); };
  const ti = document.getElementById('tInternas'); if (ti) ti.onchange = () => { st.internas = ti.checked; render(); };
  const te = document.getElementById('tEmpresas'); if (te) te.onchange = () => { st.empresas = te.checked; render(); };
  const sc = document.getElementById('selCartao'); if (sc) sc.onchange = () => { st.cartao = +sc.value; render(); };
  const scm = document.getElementById('selCatMes'); if (scm) scm.onchange = () => { st.catMes = scm.value; const y = scrollY; render(); window.scrollTo(0, y); };
  const sp = document.getElementById('selProv'); if (sp) sp.onchange = () => { st.provMes = sp.value; render(); };
  document.querySelectorAll('[data-grupo]').forEach(x => x.onclick = () => { const i = +x.dataset.grupo; st.grupoAberto = st.grupoAberto === i ? -1 : i; render(); });
  document.querySelectorAll('[data-prov]').forEach(x => x.onclick = () => irParaMesProv(x.dataset.prov));
  document.querySelectorAll('[data-parc]').forEach(x => x.onclick = () => irParaMesParc(x.dataset.parc));
  document.querySelectorAll('[data-ass]').forEach(x => x.onclick = () => irParaMesAss(x.dataset.ass));
  document.querySelectorAll('[data-rec]').forEach(x => x.onclick = () => irParaMesRec(x.dataset.rec));  document.querySelectorAll('[data-cat]').forEach(x => x.onchange = () => {
    const id = x.dataset.cat, l0 = L.find(l => l.id === id); if (!l0) return;
    if (x.value === l0.cat0) delete AJ[id]; else AJ[id] = x.value;
    for (const l of L) if (l.id === id) l.cat = x.value;
    salvarAJ(); const y = scrollY; render(); window.scrollTo(0, y);
  });
  document.querySelectorAll('[data-salvaraj]').forEach(x => x.onclick = baixarAJ);
  document.querySelectorAll('[data-mais]').forEach(x => x.onclick = () => { st.limite += 100; render(); });
}
function irPara() { let h = location.hash.slice(1); h = ALIAS[h] || h; st.pag = P[h] && (!MODO_AD || h.startsWith('ad')) ? h : (MODO_AD ? 'adHoje' : 'hoje'); st.busca = ''; st.limite = 60; render(); window.scrollTo(0, 0); }
document.getElementById('sheetBg').onclick = () => abrirMenu(false);
addEventListener('scroll', () => document.getElementById('topo').classList.toggle('rolou', scrollY > 4), {passive: true});
document.getElementById('mesAnt').onclick = () => { st.mes = somaMes(st.mes, -1); st.limite = 60; render(); };
document.getElementById('mesProx').onclick = () => { st.mes = somaMes(st.mes, 1); st.limite = 60; render(); };
document.getElementById('tema').onclick = () => {
  const escuro = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = escuro ? 'light' : 'dark';
  try { localStorage.setItem('tema', document.documentElement.dataset.theme); } catch (e) {}
  document.querySelector('meta[name=theme-color]').content = css('--bg');
  render();
};
document.getElementById('atualizado').textContent = 'Atualizado ' + D.gerado;
// recarrega o arquivo a cada 10 min (com a aba visível) para pegar a sincronização automática mais recente
let carregadoEm = Date.now();
const recarregar = () => { if (document.visibilityState === 'visible' && Date.now() - carregadoEm > 6e5) location.reload(); };
setInterval(recarregar, 6e4);
document.addEventListener('visibilitychange', recarregar);
window.addEventListener('hashchange', irPara);
if (!window.Chart) document.getElementById('conteudo').insertAdjacentHTML('beforebegin', '<div class="nota" style="padding:12px 36px">Sem internet: os gráficos não carregaram, mas as tabelas funcionam.</div>');
irPara();
}

// ---------- abertura: arquivo local (dados abertos) ou site (dados criptografados com a sua senha)
(async () => {
  try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  const aberto = JSON.parse(document.getElementById('dados').textContent);
  if (aberto) return app(aberto);
  const C = JSON.parse(document.getElementById('cofre').textContent);
  if (!C) { document.getElementById('conteudo').innerHTML = '<div class="vazio">Sem dados.</div>'; return; }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const deB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const abrir = async chave => {
    const claro = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(C.iv)}, chave, b64(C.ct));
    const txt = await new Response(new Blob([claro]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(txt);
  };
  const KEY = 'financas-chave-' + C.salt.slice(0, 12);
  try {
    const salva = localStorage.getItem(KEY);
    if (salva) {
      const chave = await crypto.subtle.importKey('raw', b64(salva), 'AES-GCM', true, ['decrypt']);
      return app(await abrir(chave));
    }
  } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
  const lock = document.getElementById('lock'), f = document.getElementById('lockForm'), erro = document.getElementById('lockErro'), btn = document.getElementById('lockBtn');
  lock.hidden = false; document.getElementById('lockSenha').focus();
  f.onsubmit = async ev => {
    ev.preventDefault(); erro.textContent = ''; btn.disabled = true; btn.textContent = 'Abrindo…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('lockSenha').value), 'PBKDF2', false, ['deriveKey']);
      const chave = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(C.salt), iterations: C.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
      const D = await abrir(chave);
      if (document.getElementById('lockLembrar').checked) try { localStorage.setItem(KEY, deB64(await crypto.subtle.exportKey('raw', chave))); } catch (e) {}
      lock.hidden = true; app(D);
    } catch (e) { erro.textContent = 'Senha incorreta.'; btn.disabled = false; btn.textContent = 'Entrar'; }
  };
})();
</script>
